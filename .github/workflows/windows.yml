name: Windows checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:desktop
      - run: npm run dist:clean
      - run: npm run test:clean
      - run: npm run release:zip
      - uses: actions/upload-artifact@v4
        with:
          name: crescent-windows-x64
          path: |
            release/*.zip
            release/*.sha256
          if-no-files-found: error
